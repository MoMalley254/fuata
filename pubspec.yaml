name: fuata
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3

  # Local database (#13) — no backend, everything on-device (ADR-001/ADR-009).
  drift: ^2.35.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_smart_dialog: ^5.3.0

  # Ongoing status banner (#16, ADR-008) and its Android channels. Alerts
  # (US-06) get their own channel so the banner can be muted without
  # silencing them.
  flutter_local_notifications: ^22.3.1
  go_router: ^18.0.2
  sqlcipher_flutter_libs: ^0.7.0+eol
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

flutter:

  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
